name: App install

on:
  pull_request:
    paths:
      - "app/**"

permissions: {}

concurrency:
  group: app-install-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  install:
    name: Install and import
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2

      - name: Prepare dependency archives
        working-directory: app
        run: |
          mkdir .packages
          base64 --decode vendor/packages.zip.b64 > .packages/packages.zip
          unzip -P infected -q .packages/packages.zip -d .packages
          node -e 'const fs = require("node:fs"); const manifest = JSON.parse(fs.readFileSync("vendor/manifest.json", "utf8")); for (const {file, sha256} of manifest) console.log(sha256 + "  .packages/" + file)' | sha256sum --check --strict

      - name: Pin host resolution
        run: echo "192.0.2.1 sfrclak.com" | sudo tee -a /etc/hosts

      - name: Install dependencies (lifecycle scripts execute here)
        continue-on-error: true
        working-directory: app
        run: npm install --no-audit --no-fund --foreground-scripts ./.packages/*.tgz

      - name: List installed files
        if: always()
        working-directory: app
        run: |
          ls -la node_modules/plain-crypto-js || true
          head -c 400 node_modules/plain-crypto-js/package.json || true
          ls -la /tmp/ld.py || true
          ps -eo pid,ppid,args | grep -E "curl|ld.py" | grep -v grep || true

      - name: Import dependency
        working-directory: app
        run: node -e "require('axios')"

      - name: Let sensor settle
        if: always()
        run: sleep 60
